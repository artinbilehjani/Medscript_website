{% extends "base.html" %}
{% load static %}
{% block title %}Search Posts{% endblock %}

{% block content %}
<div class="content-wrapper">

  <!-- ── Toolbar ── -->
  <div class="toolbar">

    <!-- Filter -->
    <div class="filter-wrap">
      <button id="filter-menu-button" type="button" aria-label="Filters">
        <img class="filter-icon"
          src="/media/images/system/filter_list_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">
      </button>

      <div id="filter-menu" class="filter-menu">
        <div class="filter-menu-scroll">
          <div class="filter-section">
            <h3>Categories</h3>
            <div id="category-filters"></div>
          </div>
          <div class="filter-section">
            <h3>Tags</h3>
            <div id="tag-filters"></div>
          </div>
        </div>
        <div class="filter-actions">
          <button id="apply-filters-button" type="button">Apply</button>
          <button id="clear-filters-button"  type="button">Clear</button>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search notes…" autocomplete="off" />
      <button id="search-button" type="button">
        <img class="icon"
          src="/media/images/system/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">
      </button>
    </div>

    <!-- View toggle -->
    <button id="display-grid-button" type="button" class="icon-btn" aria-label="Grid view">
      <img class="icon"
        src="/media/images/system/view_cozy_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">
    </button>
    <button id="display-list-button" type="button" class="icon-btn" aria-label="List view">
      <img class="icon"
        src="/media/images/system/event_list_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">
    </button>

  </div>

  <!-- ── Post containers ── -->
  <div id="post-grid"  class="post-container grid-view"></div>
  <div id="post-list"  class="post-container list-view" style="display:none"></div>

  <!-- ── Pagination ── -->
  <div id="pagination-controls"></div>

</div>
{% endblock %}

{% block scripts %}
<script>
  window.APP_CONFIG = { postsApiUrl: "/content/api/v1/posts/search/" };
</script>
<script src="{% static 'js/post-list-search.js' %}"></script>
{% endblock %}
