<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MedScript — 400</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
:root{--CODE_COLOR_A:#fbbf24;--CODE_COLOR_B:#f97316;--CODE_GLOW:rgba(251,191,36,.4);}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --purple:#e0a3ff;--pink:#ff69b4;--violet:#9370db;
  --cyan:#00ffff;--teal:#4ecdc4;--dark:#060610;
  --text:#fff;--text-dim:rgba(255,255,255,.65);
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html,body{width:100%;height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--dark);overflow:hidden;}
a{color:inherit;text-decoration:none;}

/* BG */
.bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(circle at 15% 85%,rgba(75,0,130,.7) 0%,transparent 50%),
    radial-gradient(circle at 85% 15%,rgba(139,37,99,.8) 0%,transparent 50%),
    radial-gradient(circle at 50% 50%,rgba(128,0,128,.5) 0%,transparent 60%),
    linear-gradient(135deg,#060610 0%,#1a0a2e 50%,#060610 100%);
  animation:bgPulse 12s ease-in-out infinite;}
@keyframes bgPulse{
  0%,100%{filter:brightness(.9) hue-rotate(0deg);}
  40%{filter:brightness(1.1) hue-rotate(12deg);}
  70%{filter:brightness(1.0) hue-rotate(-8deg);}
}
.neural{position:fixed;inset:0;z-index:1;pointer-events:none;}
.nline{position:absolute;left:0;width:100%;height:1px;animation:nPulse 3s ease-in-out infinite;}
.nline:nth-child(1){top:20%;background:linear-gradient(90deg,transparent,#e0a3ff33,transparent);animation-delay:0s;}
.nline:nth-child(2){top:50%;background:linear-gradient(90deg,transparent,#ff69b433,transparent);animation-delay:-1.2s;}
.nline:nth-child(3){top:75%;background:linear-gradient(90deg,transparent,#9370db33,transparent);animation-delay:-2.4s;}
@keyframes nPulse{0%,100%{opacity:.15;transform:scaleX(.4);}50%{opacity:.9;transform:scaleX(1);}}

/* Stage */
.stage{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:0;}

/* Logo */
.logo-ring{position:relative;width:110px;height:110px;flex-shrink:0;animation:logoIn 1s var(--ease) both;}
@keyframes logoIn{from{opacity:0;transform:scale(.5);filter:blur(10px);}to{opacity:1;transform:scale(1);filter:blur(0);}}
.logo-ring::before{content:'';position:absolute;inset:-4px;border-radius:50%;
  background:linear-gradient(var(--dark),var(--dark)) padding-box,
  conic-gradient(from 0deg,#e0a3ff,#ff69b4,#9370db,#4ecdc4,#e0a3ff) border-box;
  animation:spin 6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.logo-img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 28%;position:relative;z-index:2;filter:drop-shadow(0 0 18px rgba(224,163,255,.5));}

/* Error code */
.err-code{font-family:'Cinzel',serif;font-size:clamp(80px,18vw,140px);font-weight:600;line-height:1;
  background:linear-gradient(90deg,var(--CODE_COLOR_A),var(--CODE_COLOR_B));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 40px var(--CODE_GLOW));
  animation:codeIn 1s var(--ease) .3s both;}
@keyframes codeIn{from{opacity:0;transform:scale(1.4);letter-spacing:.5em;}to{opacity:1;transform:scale(1);}}

/* Illustration */
.illustration{font-size:clamp(60px,12vw,90px);line-height:1;animation:emojiIn 1s var(--ease) .5s both;filter:drop-shadow(0 0 20px rgba(224,163,255,.4));}
@keyframes emojiIn{from{opacity:0;transform:translateY(-30px) rotate(-15deg);}to{opacity:1;transform:translateY(0) rotate(0deg);}}

.title{margin-top:12px;font-size:clamp(18px,4vw,26px);font-weight:700;color:var(--purple);letter-spacing:.02em;animation:fadeUp 1s var(--ease) .7s both;}
.subtitle{margin-top:8px;font-size:clamp(13px,2.5vw,15px);color:rgba(255,255,255,.5);max-width:480px;line-height:1.6;animation:fadeUp 1s var(--ease) .85s both;}
.joke{margin-top:10px;font-size:clamp(12px,2vw,13px);color:rgba(224,163,255,.55);font-style:italic;max-width:420px;animation:fadeUp 1s var(--ease) 1s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* Button */
.home-btn{
  margin-top:28px;
  display:inline-flex;align-items:center;gap:10px;
  padding:13px 28px;border-radius:40px;
  background:linear-gradient(135deg,rgba(147,112,219,.2),rgba(255,105,180,.15));
  border:1px solid rgba(224,163,255,.35);
  color:var(--purple);font-size:14px;font-weight:600;letter-spacing:.05em;
  cursor:pointer;font-family:inherit;
  box-shadow:0 0 24px rgba(224,163,255,.15),inset 0 1px 0 rgba(255,255,255,.08);
  transition:all .25s;animation:fadeUp 1s var(--ease) 1.2s both;
  text-decoration:none;
}
.home-btn:hover{background:linear-gradient(135deg,rgba(147,112,219,.35),rgba(255,105,180,.25));border-color:rgba(224,163,255,.6);box-shadow:0 0 36px rgba(224,163,255,.35),0 0 80px rgba(224,163,255,.1);transform:translateY(-2px);}
.btn-icon{font-size:18px;}

/* Countdown */
.countdown-wrap{margin-top:20px;animation:fadeUp 1s var(--ease) 1.35s both;}
.countdown-ring{position:relative;width:56px;height:56px;margin:0 auto;}
.cdr-svg{width:56px;height:56px;transform:rotate(-90deg);}
.cdr-track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3;}
.cdr-fill{fill:none;stroke:url(#cdGrad);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:138;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear;}
.cdr-number{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:var(--purple);}
.countdown-label{margin-top:8px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.25);}


.illustration{animation:emojiIn 1s var(--ease) .5s both,wobble 2s ease-in-out 1.5s infinite;}
@keyframes wobble{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}

</style>
</head>

<script>

// Countdown + redirect
const TOTAL = 10;
let remaining = TOTAL;
const numEl  = document.getElementById('cdNum');
const fillEl = document.getElementById('cdFill');
const CIRC   = 138; // 2*pi*22

function tick() {
  remaining--;
  numEl.textContent = remaining;
  const pct = remaining / TOTAL;
  fillEl.style.strokeDashoffset = CIRC * (1 - pct);
  if (remaining <= 0) { window.location.href = '/home/'; }
  else setTimeout(tick, 1000);
}
setTimeout(tick, 1000);
