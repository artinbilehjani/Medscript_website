# ═══════════════════════════════════════════════════════════════════
# nginx.conf — this is your actual line of defense for file downloads.
#
# Three jobs, in order of importance for your situation:
#   1. Serve /static/ and /media/ files DIRECTLY — Django/Gunicorn never
#      sees these requests. A 50MB PDF download ties up an nginx worker
#      (cheap, event-driven, handles thousands of these) instead of a
#      Gunicorn worker (expensive, your scarce resource).
#   2. Rate-limit how many simultaneous downloads/requests one IP can
#      make — this is your "buffer that delays requests at peak time"
#      from your question, done at the cheapest possible layer.
#   3. Proxy everything else (actual page/API requests) to Gunicorn.
# ═══════════════════════════════════════════════════════════════════

# ── Rate limit zones (defined once, used below) ──────────────────
# "leaky bucket": each zone tracks request rate per client IP in a
# small shared-memory region. Requests over the limit get queued
# briefly (burst) then rejected with 503 if still over.

# General page/API traffic: 10 requests/second per IP, generous burst.
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

# File downloads specifically: much stricter — 2 requests/second per IP.
# This is the actual answer to "should I delay/buffer requests at peak
# time" — yes, and this is how: cheaply, in nginx, before Django ever
# sees the request.
limit_req_zone $binary_remote_addr zone=download_limit:10m rate=2r/s;

# Cap how many files one IP can be actively downloading AT ONCE
# (not just per-second — this catches someone who started 20 downloads
# and is slowly trickling them all in over a bad connection).
limit_conn_zone $binary_remote_addr zone=download_conn:10m;

upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;  # ← replace before deploying

    client_max_body_size 25M;   # max upload size (post images, files admins upload)

    # ── Static files (CSS/JS/admin assets) ──────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;   # these are requested constantly, logging them is noise
    }

    # ── Media files — uploaded images AND post files ────────────
    # This is the route that matters most for your question.
    location /media/ {
        alias /app/media/;

        # General rate limit for media (covers post-card images,
        # avatars, etc. — lighter touch since these are small/cached).
        limit_req zone=general_limit burst=20 nodelay;

        expires 7d;
        add_header Cache-Control "public";
    }

    # ── PostFile downloads specifically ──────────────────────────
    # If your download URLs live under a distinct path (recommended —
    # see 08_file_download_views.py for the X-Accel-Redirect pattern
    # that makes this work cleanly with `is_downloadable` / private
    # files), give them their own location block with STRICTER limits:
    location /protected-media/ {
        internal;   # NOT reachable directly from the internet — only
                    # Django can send users here via X-Accel-Redirect.
                    # This is what makes is_downloadable=False actually
                    # enforceable, instead of just a UI suggestion.
        alias /app/media/;

        limit_req zone=download_limit burst=5 nodelay;
        limit_conn download_conn 3;   # max 3 simultaneous downloads per IP

        # If the rate limit IS hit, nginx returns 503 automatically.
        # Customize the message:
        error_page 503 = @download_busy;
    }

    location @download_busy {
        default_type application/json;
        return 503 '{"detail": "Server is busy, please try again in a few moments."}';
    }

    # ── Everything else → Gunicorn ───────────────────────────────
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't let one slow client tie up a connection forever.
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Friendlier than nginx's bare-bones default 503/429 pages.
    error_page 503 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 503 '{"detail": "Too many requests — please wait a moment and try again."}';
    }
}

# ═══════════════════════════════════════════════════════════════════
# HTTPS: once you have a domain pointed at the VPS, run certbot
# (Let's Encrypt) to get a free certificate, then nginx needs a
# `listen 443 ssl;` server block. Not included here since it requires
# your actual domain name — ask me for this once DNS is set up, it's
# a 10-minute addition.
# ═══════════════════════════════════════════════════════════════════