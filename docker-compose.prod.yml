services:
  db:
    image: postgres:18-alpine
    container_name: db
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      - envs/prod/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medscript_admin -d medscript"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

  backend:
    build:
      context: .
      dockerfile: dockerfiles/prod/Dockerfile
    container_name: backend_medscript
    command: gunicorn core.wsgi:application --config gunicorn.conf.py
    volumes:
      - static_volume:/app/collected_static  
      - media_volume:/app/media
    env_file:
      - envs/prod/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700M

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/collected_static:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  pgdata:
  static_volume:
  media_volume: